<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비교노트 — 생활용품 스펙 비교</title>
<meta name="description" content="무선청소기·키보드·빨래건조대 등 생활용품을 스펙표와 고르는 기준으로 비교합니다.">
<link rel="canonical" href="https://jhlee0409.github.io/bigyo-note-site/">
<style>
:root{--bg:#fff;--fg:#1a1d24;--sub:#5b6474;--line:#e3e6ec;--accent:#1d4ed8;--note:#f5f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#131b2e;--fg:#f1f3f7;--sub:#b5bccb;--line:#2c3650;--accent:#8fb3ff;--note:#1b2439}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}a{color:var(--accent)}
header a{color:var(--fg);text-decoration:none;font-weight:700}
.notice{background:var(--note);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--sub)}
h1{font-size:26px;line-height:1.35;margin:16px 0 8px}h2{font-size:20px;margin:32px 0 8px}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--note)}tbody th{color:var(--sub);font-weight:600;white-space:nowrap}
.product{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.product h3{margin:0 0 4px;font-size:16px}.btn{display:inline-block;margin-top:6px;padding:8px 14px;border-radius:6px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600}
.small{font-size:13px;color:var(--sub)}ul{padding-left:20px}
</style>
</head>
<body>
<main>
<header><a href="./">비교노트</a> <span class="small">스펙표·단가로 따지는 생활용품 비교</span></header>
<p class="notice"><strong>[광고]</strong> 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<h1>상품군별 스펙 비교</h1><ul><li><a href="c/%EB%AC%B4%EC%84%A0%ED%82%A4%EB%B3%B4%EB%93%9C/">무선 키보드 3종 스펙 비교: 컴팩트형과 풀배열, 무엇을 볼까</a></li></ul>
<footer class="small"><p>[광고] 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 스펙은 표에 적은 출처 기준이며, 가격·재고는 쿠팡에서 확인하세요.</p></footer>
</main>
</body>
</html>
